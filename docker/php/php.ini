; Cấu hình PHP cho môi trường phát triển (Docker).
date.timezone = Asia/Ho_Chi_Minh
default_charset = "UTF-8"

; Upload hình ảnh (thư viện ảnh, ảnh đại diện tin tức, học bạ đính kèm)
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

; Hiển thị lỗi khi dev; production nên tắt display_errors.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

session.cookie_httponly = 1
session.use_strict_mode = 1
