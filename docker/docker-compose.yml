# Chạy từ thư mục docker/:  docker compose up -d --build
# Web:        http://localhost:${WEB_PORT}
# phpMyAdmin: http://localhost:${PMA_PORT}
name: dnc-school

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dnc_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Mount mã nguồn để sửa code là thấy ngay, không cần build lại.
      - ../src:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dnc_school}
      DB_USER: ${DB_USER:-dnc}
      DB_PASS: ${DB_PASS:-dnc123}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: dnc_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-dnc_school}
      MYSQL_USER: ${DB_USER:-dnc}
      MYSQL_PASSWORD: ${DB_PASS:-dnc123}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/mysql
      # Các file .sql trong mysql/init chỉ chạy MỘT LẦN khi volume db_data còn trống.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: dnc_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
